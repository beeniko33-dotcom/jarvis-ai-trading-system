services:
  app:
    build: .
    restart: unless-stopped
    environment:
      JARVIS_DATA_DIR: /data
      JARVIS_ACCESS_USERNAME: ${JARVIS_ACCESS_USERNAME:?Set JARVIS_ACCESS_USERNAME in .env}
      JARVIS_ACCESS_PASSWORD: ${JARVIS_ACCESS_PASSWORD:?Set JARVIS_ACCESS_PASSWORD in .env}
      JARVIS_HTTPS_PROXY: "1"
    expose:
      - "8000"
    volumes:
      - jarvis_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:?Set JARVIS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  jarvis_data:
  caddy_data:
  caddy_config:
